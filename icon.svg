<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-hidden="true">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11203f"/><stop offset="1" stop-color="#0a1120"/></linearGradient>
<radialGradient id="halo" cx=".5" cy=".45" r=".52"><stop offset="0" stop-color="#5182ef" stop-opacity=".42"/><stop offset="1" stop-color="#5182ef" stop-opacity="0"/></radialGradient>
<linearGradient id="im" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#87a9f4"/><stop offset="1" stop-color="#184099"/></linearGradient><linearGradient id="iv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#87a9f4"/><stop offset="1" stop-color="#2563eb"/></linearGradient><linearGradient id="iw" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dfe5ee"/></linearGradient><linearGradient id="ig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f2a62b"/></linearGradient><radialGradient id="ih" cx=".3" cy=".25" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><linearGradient id="is" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>
<style>.ifl,.ipu,.ibl,.isp,.iwg,.iri,.isd,.ipop{transform-box:fill-box;transform-origin:50% 50%}.igr{transform-box:fill-box;transform-origin:50% 100%}@keyframes ifl{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}.ifl{animation:ifl 4.2s ease-in-out infinite}@keyframes isd{0%,100%{transform:scaleX(1);opacity:.32}50%{transform:scaleX(.85);opacity:.2}}.isd{animation:isd 4.2s ease-in-out infinite}@keyframes ipu{0%,100%{opacity:.55}50%{opacity:1}}.ipu{animation:ipu 2.4s ease-in-out infinite}@keyframes ibl{0%,44%,56%,100%{opacity:1}50%{opacity:.15}}.ibl{animation:ibl 3s steps(1,end) infinite}@keyframes isp{to{transform:rotate(360deg)}}.isp{animation:isp 14s linear infinite}@keyframes iwg{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}.iwg{animation:iwg 3.4s ease-in-out infinite}@keyframes iri{0%{transform:translateY(2px);opacity:.7}100%{transform:translateY(-3.5px);opacity:1}}.iri{animation:iri 1.6s ease-in-out infinite alternate}@keyframes igr{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(1)}}.igr{animation:igr 2.8s ease-in-out infinite}@keyframes ipop{0%,100%{transform:scale(.9)}50%{transform:scale(1.08)}}.ipop{animation:ipop 2.6s ease-in-out infinite}@keyframes ish{0%,60%{transform:translateX(-30px)}100%{transform:translateX(70px)}}.ish{animation:ish 5s ease-in-out infinite}@keyframes idash{to{stroke-dashoffset:-40}}.idash{animation:idash 2.4s linear infinite}@keyframes isw{0%,100%{transform:rotate(-50deg)}50%{transform:rotate(35deg)}}.tw{transform-box:fill-box;transform-origin:50% 50%;animation:tw 3.2s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
<rect x="2" y="2" width="60" height="60" rx="14" fill="url(#halo)"/>
<rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
<ellipse class="isd" cx="32" cy="55" rx="15" ry="2.8" fill="#000" opacity=".32"/><g class="ifl"><rect x="10" y="18" width="44" height="30" rx="5" fill="url(#iw)"/><path d="M10 23 32 37l22-14" fill="none" stroke="url(#im)" stroke-width="3.2" stroke-linejoin="round"/><path d="M10 23v-0a5 5 0 0 1 5-5h34a5 5 0 0 1 5 5L32 37z" fill="url(#im)"/></g><g class="ipop"><circle cx="49" cy="17" r="6.5" fill="#ff5d73"/><text x="49" y="20.5" font-family="Segoe UI,Arial,sans-serif" font-weight="800" font-size="9" fill="#fff" text-anchor="middle">1</text></g>
<g transform="translate(55 9) scale(.28)"><path class="tw" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#fff"/></g>
<g transform="translate(9 54) scale(.2)"><path class="tw" style="animation-delay:1.4s" d="M0 -10 C1.2 -2.6 2.6 -1.2 10 0 C2.6 1.2 1.2 2.6 0 10 C-1.2 2.6 -2.6 1.2 -10 0 C-2.6 -1.2 -1.2 -2.6 0 -10Z" fill="#fff"/></g>
</svg>
